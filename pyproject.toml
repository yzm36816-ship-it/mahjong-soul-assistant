[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mahjong-soul-assistant"
version = "0.3.0"
description = "Local window-based Mahjong Soul analysis workbench"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11.2.1,<14", "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "windows-capture==2.0.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
ml = ["torch>=2.5,<3"]
simulation = ["riichienv==0.4.10"]
web-test = ["httpx>=0.27,<1"]

[project.scripts]
mahjong-assistant = "mahjong_assistant.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
